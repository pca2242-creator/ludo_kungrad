<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ludo Deluxe Game</title>
    <style>
        :root {
            --red: #ff3b30;
            --green: #34c759;
            --yellow: #ffcc00;
            --blue: #007aff;
            --bg-dark: #1e1e24;
            --board-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 10px;
            max-width: 500px;
            width: 100%;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .turn-badge {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        #ludo-board {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1 / 1;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            border: 4px solid #2d2d38;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-panel {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .dice-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .dice {
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #222;
            box-shadow: 0 6px 0 #cbd5e1, 0 10px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
        }

        .dice:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #cbd5e1, 0 4px 6px rgba(0,0,0,0.3);
        }

        .dice.rolling {
            animation: diceSpin 0.15s infinite linear;
        }

        @keyframes diceSpin {
            0% { transform: rotate(0deg) scale(1.05); }
            50% { transform: rotate(180deg) scale(0.95); }
            100% { transform: rotate(360deg) scale(1.05); }
        }

        .btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
        }

        .status-text {
            font-size: 0.95rem;
            color: #cbd5e1;
            text-align: center;
            min-height: 24px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header-panel">
        <div class="turn-indicator">
            <div id="turn-badge" class="turn-badge" style="background-color: var(--red); color: var(--red);"></div>
            <span id="turn-text">Qizil yurishi</span>
        </div>
        <button class="btn" onclick="resetGame()">Qayta boshlash</button>
    </div>

    <div id="ludo-board">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="status-text" id="status-msg">Zar tashlash uchun zarni bosing!</div>

    <div class="controls-panel">
        <div class="dice-container">
            <div id="dice" class="dice" onclick="rollDice()">🎲</div>
            <div style="display:flex; flex-direction:column; gap:4px;">
                <span style="font-size:0.8rem; color:#94a3b8;">Zar qiymati:</span>
                <span id="dice-value" style="font-size:1.4rem; font-weight:bold; color:#fff;">-</span>
            </div>
        </div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300 + Math.random() * 400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
    }

    function playMoveSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        drawBoard();
    }

    window.addEventListener('resize', resizeCanvas);

    const COLORS = {
        red: '#ff3b30', green: '#34c759', yellow: '#ffcc00', blue: '#007aff',
        white: '#ffffff', path: '#f1f5f9'
    };

    const PLAYERS = ['red', 'green', 'yellow', 'blue'];
    let currentPlayerIdx = 0;
    let currentDiceValue = null;
    let canRoll = true;

    const tokens = {
        red: [-1, -1, -1, -1], green: [-1, -1, -1, -1],
        yellow: [-1, -1, -1, -1], blue: [-1, -1, -1, -1]
    };

    function getBoardCellSize() {
        return canvas.getBoundingClientRect().width / 15;
    }

    const BASE_CENTERS = {
        red: [{ x: 2.25, y: 2.25 }, { x: 3.75, y: 2.25 }, { x: 2.25, y: 3.75 }, { x: 3.75, y: 3.75 }],
        green: [{ x: 11.25, y: 2.25 }, { x: 12.75, y: 2.25 }, { x: 11.25, y: 3.75 }, { x: 12.75, y: 3.75 }],
        yellow: [{ x: 11.25, y: 11.25 }, { x: 12.75, y: 11.25 }, { x: 11.25, y: 12.75 }, { x: 12.75, y: 12.75 }],
        blue: [{ x: 2.25, y: 11.25 }, { x: 3.75, y: 11.25 }, { x: 2.25, y: 12.75 }, { x: 3.75, y: 12.75 }]
    };

    const MAIN_PATH = [
        {x: 1, y: 6}, {x: 2, y: 6}, {x: 3, y: 6}, {x: 4, y: 6}, {x: 5, y: 6},
        {x: 6, y: 5}, {x: 6, y: 4}, {x: 6, y: 3}, {x: 6, y: 2}, {x: 6, y: 1}, {x: 6, y: 0},
        {x: 7, y: 0}, {x: 8, y: 0},
        {x: 8, y: 1}, {x: 8, y: 2}, {x: 8, y: 3}, {x: 8, y: 4}, {x: 8, y: 5},
        {x: 9, y: 6}, {x: 10, y: 6}, {x: 11, y: 6}, {x: 12, y: 6}, {x: 13, y: 6}, {x: 14, y: 6},
        {x: 14, y: 7}, {x: 14, y: 8},
        {x: 13, y: 8}, {x: 12, y: 8}, {x: 11, y: 8}, {x: 10, y: 8}, {x: 9, y: 8},
        {x: 8, y: 9}, {x: 8, y: 10}, {x: 8, y: 11}, {x: 8, y: 12}, {x: 8, y: 13}, {x: 8, y: 14},
        {x: 7, y: 14}, {x: 6, y: 14},
        {x: 6, y: 13}, {x: 6, y: 12}, {x: 6, y: 11}, {x: 6, y: 10}, {x: 6, y: 9},
        {x: 5, y: 8}, {x: 4, y: 8}, {x: 3, y: 8}, {x: 2, y: 8}, {x: 1, y: 8}, {x: 0, y: 8},
        {x: 0, y: 7}, {x: 0, y: 6}
    ];

    const START_INDEX = { red: 0, green: 13, yellow: 26, blue: 39 };

    function drawBoard() {
        const rect = canvas.getBoundingClientRect();
        const S = rect.width / 15;
        ctx.clearRect(0, 0, rect.width, rect.height);

        drawBaseSquare(0, 0, 6, 6, COLORS.red);
        drawBaseSquare(9, 0, 6, 6, COLORS.green);
        drawBaseSquare(9, 9, 6, 6, COLORS.yellow);
        drawBaseSquare(0, 9, 6, 6, COLORS.blue);

        drawHomeBaseCircles(0, 0, COLORS.red, BASE_CENTERS.red, S);
        drawHomeBaseCircles(9, 0, COLORS.green, BASE_CENTERS.green, S);
        drawHomeBaseCircles(9, 9, COLORS.yellow, BASE_CENTERS.yellow, S);
        drawHomeBaseCircles(0, 9, COLORS.blue, BASE_CENTERS.blue, S);

        drawTracks(S);
        drawCenterTriangle(S);
        drawAllTokens(S);
    }

    function drawBaseSquare(gridX, gridY, w, h, color) {
        const S = getBoardCellSize();
        ctx.fillStyle = color;
        ctx.fillRect(gridX * S, gridY * S, w * S, h * S);
        ctx.strokeStyle = '#2d2d38';
        ctx.lineWidth = 2;
        ctx.strokeRect(gridX * S, gridY * S, w * S, h * S);
    }

    function drawHomeBaseCircles(gridX, gridY, color, centers, S) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect((gridX + 1) * S, (gridY + 1) * S, 4 * S, 4 * S, 12);
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.stroke();

        centers.forEach(c => {
            ctx.beginPath();
            ctx.arc(c.x * S, c.y * S, S * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = color + '22';
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();
        });
    }

    function drawTracks(S) {
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1;

        for (let x = 0; x < 15; x++) {
            for (let y = 0; y < 15; y++) {
                if ((x < 6 && y < 6) || (x > 8 && y < 6) || (x < 6 && y > 8) || (x > 8 && y > 8) || (x >= 6 && x <= 8 && y >= 6 && y <= 8)) continue;
                ctx.fillStyle = COLORS.path;
                ctx.fillRect(x * S, y * S, S, S);
                ctx.strokeRect(x * S, y * S, S, S);
            }
        }

        fillCell(1, 6, COLORS.red, S);
        for (let x = 1; x <= 5; x++) fillCell(x, 7, COLORS.red, S);
        fillCell(8, 1, COLORS.green, S);
        for (let y = 1; y <= 5; y++) fillCell(7, y, COLORS.green, S);
        fillCell(13, 8, COLORS.yellow, S);
        for (let x = 9; x <= 13; x++) fillCell(x, 7, COLORS.yellow, S);
        fillCell(6, 13, COLORS.blue, S);
        for (let y = 9; y <= 13; y++) fillCell(7, y, COLORS.blue, S);
    }

    function fillCell(x, y, color, S) {
        ctx.fillStyle = color;
        ctx.fillRect(x * S, y * S, S, S);
        ctx.strokeStyle = '#1e1e24';
        ctx.strokeRect(x * S, y * S, S, S);
    }

    function drawCenterTriangle(S) {
        const cx = 7.5 * S, cy = 7.5 * S;
        const triangles = [
            { path: [[6, 6], [6, 9]], color: COLORS.red },
            { path: [[6, 6], [9, 6]], color: COLORS.green },
            { path: [[9, 6], [9, 9]], color: COLORS.yellow },
            { path: [[6, 9], [9, 9]], color: COLORS.blue }
        ];

        triangles.forEach(t => {
            ctx.beginPath();
            ctx.moveTo(t.path[0][0] * S, t.path[0][1] * S);
            ctx.lineTo(t.path[1][0] * S, t.path[1][1] * S);
            ctx.lineTo(cx, cy);
            ctx.fillStyle = t.color;
            ctx.fill();
        });
    }

    function getTokenCoords(color, stepIndex, tokenIdx, S) {
        if (stepIndex === -1) {
            const pt = BASE_CENTERS[color][tokenIdx];
            return { x: pt.x * S, y: pt.y * S };
        }
        if (stepIndex < 51) {
            const absIdx = (START_INDEX[color] + stepIndex) % 52;
            const cell = MAIN_PATH[absIdx];
            return { x: (cell.x + 0.5) * S, y: (cell.y + 0.5) * S };
        } else {
            const remaining = stepIndex - 50;
            let cell = { x: 7, y: 7 };
            if (color === 'red') cell = { x: remaining, y: 7 };
            if (color === 'green') cell = { x: 7, y: remaining };
            if (color === 'yellow') cell = { x: 14 - remaining, y: 7 };
            if (color === 'blue') cell = { x: 7, y: 14 - remaining };
            return { x: (cell.x + 0.5) * S, y: (cell.y + 0.5) * S };
        }
    }

    function drawLocationPinToken(x, y, color, S) {
        const pinWidth = S * 0.65;
        const pinHeight = S * 0.85;

        ctx.save();
        ctx.translate(x, y - pinHeight * 0.35);

        ctx.beginPath();
        ctx.ellipse(0, pinHeight * 0.45, pinWidth * 0.4, pinWidth * 0.2, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(0, pinHeight * 0.45);
        ctx.bezierCurveTo(-pinWidth * 0.5, pinHeight * 0.05, -pinWidth * 0.5, -pinHeight * 0.35, 0, -pinHeight * 0.35);
        ctx.bezierCurveTo(pinWidth * 0.5, -pinHeight * 0.35, pinWidth * 0.5, pinHeight * 0.05, 0, pinHeight * 0.45);
        ctx.closePath();

        ctx.fillStyle = color;
        ctx.fill();

        const grad = ctx.createLinearGradient(-pinWidth*0.3, -pinHeight*0.3, pinWidth*0.3, pinHeight*0.3);
        grad.addColorStop(0, 'rgba(255,255,255,0.4)');
        grad.addColorStop(0.5, 'rgba(255,255,255,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.25)');
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, -pinHeight * 0.08, pinWidth * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        ctx.restore();
    }

    function drawAllTokens(S) {
        PLAYERS.forEach(color => {
            tokens[color].forEach((stepIdx, tokenIdx) => {
                const pos = getTokenCoords(color, stepIdx, tokenIdx, S);
                drawLocationPinToken(pos.x, pos.y, COLORS[color], S);
            });
        });
    }

    function rollDice() {
        if (!canRoll) return;
        canRoll = false;

        const diceEl = document.getElementById('dice');
        const statusEl = document.getElementById('status-msg');
        diceEl.classList.add('rolling');
        statusEl.innerText = "Zar aylanmoqda...";

        let ticks = 0;
        const maxTicks = 12;
        
        const tickInterval = setInterval(() => {
            playTickSound();
            diceEl.innerText = Math.floor(Math.random() * 6) + 1;
            ticks++;

            if (ticks >= maxTicks) {
                clearInterval(tickInterval);
                diceEl.classList.remove('rolling');

                currentDiceValue = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'][currentDiceValue - 1];
                document.getElementById('dice-value').innerText = currentDiceValue;

                handleDiceResult();
            }
        }, 80);
    }

    function handleDiceResult() {
        const color = PLAYERS[currentPlayerIdx];
        const playerTokens = tokens[color];

        const movableIndices = [];
        playerTokens.forEach((pos, idx) => {
            if (pos === -1 && currentDiceValue === 6) movableIndices.push(idx);
            else if (pos >= 0 && pos + currentDiceValue <= 56) movableIndices.push(idx);
        });

        const statusEl = document.getElementById('status-msg');

        if (movableIndices.length === 0) {
            statusEl.innerText = "Yurish imkoni yo'q! Navbat o'tadi.";
            setTimeout(nextTurn, 1200);
        } else if (movableIndices.length === 1) {
            statusEl.innerText = "Avto-yurish bajarilmoqda...";
            setTimeout(() => moveToken(color, movableIndices[0], currentDiceValue), 600);
        } else {
            statusEl.innerText = "Yurmoqchi bo'lgan toshingizni tanlang!";
            enableTokenSelection(color, movableIndices);
        }
    }

    let clickHandler = null;

    function enableTokenSelection(color, movableIndices) {
        const S = getBoardCellSize();

        clickHandler = function(e) {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            for (let idx of movableIndices) {
                const pos = getTokenCoords(color, tokens[color][idx], idx, S);
                if (Math.hypot(clickX - pos.x, clickY - pos.y) < S * 0.7) {
                    canvas.removeEventListener('click', clickHandler);
                    moveToken(color, idx, currentDiceValue);
                    break;
                }
            }
        };

        canvas.addEventListener('click', clickHandler);
    }

    function moveToken(color, tokenIdx, steps) {
        playMoveSound();
        if (tokens[color][tokenIdx] === -1 && steps === 6) tokens[color][tokenIdx] = 0;
        else tokens[color][tokenIdx] += steps;

        drawBoard();

        if (steps === 6) {
            document.getElementById('status-msg').innerText = "6 tushdi! Yana bir marta zar tashlang.";
            canRoll = true;
        } else {
            nextTurn();
        }
    }

    function nextTurn() {
        currentPlayerIdx = (currentPlayerIdx + 1) % 4;
        const color = PLAYERS[currentPlayerIdx];
        
        const badge = document.getElementById('turn-badge');
        badge.style.backgroundColor = COLORS[color];
        badge.style.color = COLORS[color];

        const names = { red: "Qizil", green: "Yashil", yellow: "Sariq", blue: "Ko'k" };
        document.getElementById('turn-text').innerText = `${names[color]} yurishi`;
        document.getElementById('status-msg').innerText = "Zar tashlash uchun zarni bosing!";
        document.getElementById('dice-value').innerText = "-";
        canRoll = true;
    }

    function resetGame() {
        PLAYERS.forEach(c => tokens[c] = [-1, -1, -1, -1]);
        currentPlayerIdx = 0;
        canRoll = true;
        document.getElementById('dice-value').innerText = "-";
        document.getElementById('dice').innerText = "🎲";
        document.getElementById('turn-badge').style.backgroundColor = COLORS.red;
        document.getElementById('turn-text').innerText = "Qizil yurishi";
        document.getElementById('status-msg').innerText = "O'yin qayta boshlandi!";
        drawBoard();
    }

    setTimeout(resizeCanvas, 100);
</script>
</body>
</html>
