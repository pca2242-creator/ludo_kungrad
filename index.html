<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo Game</title>
    <script src="https://telegram.org"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h2>Ludo Kungrad ??</h2>
        
        <!-- LUDO TAXTASI -->
        <div class="ludo-board">
            <!-- Qizil o'yinchi uyi (Tepada chapda) -->
            <div class="home red-home">
                <div class="base-box">
                    <div class="piece red-piece" id="red-p1"></div>
                    <div class="piece red-piece" id="red-p2"></div>
                </div>
            </div>
            
            <!-- Tepadagi tik yo'lak -->
            <div class="path-vertical">
                <div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div>
            </div>
            
            <!-- Ko'k o'yinchi uyi (Tepada o'ngda) -->
            <div class="home blue-home">
                <div class="base-box">
                    <div class="piece blue-piece" id="blue-p1"></div>
                    <div class="piece blue-piece" id="blue-p2"></div>
                </div>
            </div>
        </div>

        <!-- PASDA ALOHIDA ZARK (KUBIK) QISMI -->
        <div class="dice-section">
            <p id="turn-text">Navbat: <span style="color: #ff4d4d; font-weight: bold;">Qizil</span></p>
            <div class="dice-box" id="dice-view">1</div>
            <button id="roll-btn" onclick="playTurn()">Zarkni tashlash ??</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
