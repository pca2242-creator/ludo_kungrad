<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Ludo</title>
    <script src="https://telegram.org"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h2>Ludo Kungrad ??</h2>
        
        <!-- O'YIN TAXTASI -->
        <div class="ludo-board">
            
            <!-- Qizil o'yinchi uyi (Boshlang'ich joyi) -->
            <div class="player-home red-home">
                <div class="home-box">
                    <div class="piece red-piece" id="red-p1"></div>
                    <div class="piece red-piece" id="red-p2"></div>
                </div>
            </div>
            
            <!-- O'yin yo'lagi (Kataklar) -->
            <div class="main-path">
                <div class="step-cell" id="cell-1"></div>
                <div class="step-cell" id="cell-2"></div>
                <div class="step-cell" id="cell-3"></div>
                <div class="step-cell" id="cell-4"></div>
                <div class="step-cell" id="cell-5"></div>
                <div class="step-cell" id="cell-6"></div>
            </div>
            
            <!-- Ko'k o'yinchi uyi (Boshlang'ich joyi) -->
            <div class="player-home blue-home">
                <div class="home-box">
                    <div class="piece blue-piece" id="blue-p1"></div>
                    <div class="piece blue-piece" id="blue-p2"></div>
                </div>
            </div>

        </div>

        <!-- ALOHIDA KUBIK (ZARK) QISMI -->
        <div class="dice-section">
            <p id="turn-text">Navbat: <span style="color: #ff4d4d; font-weight: bold;">Qizil</span></p>
            <div class="dice-box" id="dice-view">1</div>
            <button id="roll-btn" onclick="playTurn()">Zarkni tashlash ??</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
