<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Kungrad Pro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #1a365d, #0f172a);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        /* O'yin paneli */
        .info-panel {
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #current-turn { color: #ef4444; }

        /* Ludo Taxtasi */
        .ludo-board {
            width: 450px;
            height: 450px;
            background-color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            border: 6px solid #334155;
            position: relative;
        }

        /* Rangli Katta Uylar */
        .home { grid-column: span 6; grid-row: span 6; display: flex; justify-content: center; align-items: center; }
        .red-home { background-color: #ef4444; }
        .green-home { background-color: #10b981; }
        .blue-home { background-color: #3b82f6; }
        .yellow-home { background-color: #eab308; }

        .home-inner {
            width: 70%; height: 70%; background-color: #fff; border-radius: 8px;
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            padding: 10px; box-sizing: border-box; gap: 10px;
        }

        /* Toshlar (Figuralar) */
        .token {
            width: 100%; height: 100%; border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 -4px 6px rgba(0,0,0,0.2);
            cursor: pointer; position: relative; transition: transform 0.2s;
            border: 2px solid white; box-sizing: border-box;
        }
        .token:hover { transform: scale(1.1); }
        .token.active-turn { animation: bounce 0.5s infinite alternate; border: 2px solid #fff; box-shadow: 0 0 12px #fff; }

        .red-token { background: radial-gradient(circle at 30% 30%, #ff8787, #ef4444, #991b1b); }
        .green-token { background: radial-gradient(circle at 30% 30%, #6ee7b7, #10b981, #065f46); }
        .blue-token { background: radial-gradient(circle at 30% 30%, #93c5fd, #3b82f6, #1e40af); }
        .yellow-token { background: radial-gradient(circle at 30% 30%, #fde047, #eab308, #854d0e); }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }

        /* Yo'lak katakchalari */
        .cell { border: 1px solid #cbd5e1; box-sizing: border-box; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; }
        .red-path { background-color: #fca5a5; }
        .green-path { background-color: #6ee7b7; }
        .blue-path { background-color: #93c5fd; }
        .yellow-path { background-color: #fde047; }

        /* Marra (Markaz) */
        .center-marra {
            grid-column: span 3; grid-row: span 3;
            background: linear-gradient(135deg, #ef4444 50%, #10b981 50%), linear-gradient(45deg, #3b82f6 50%, #eab308 50%);
            background-size: 100% 100%; position: relative;
            display: flex; justify-content: center; align-items: center; font-weight: bold; color: #334155; font-size: 12px;
        }
        .marra-text { background: white; padding: 2px 6px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 10; }
/* Boshqaruv tugmalari */
        .controls { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .dice-btn {
            background: #3b82f6; border: none; color: white; padding: 12px 30px;
            font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4); transition: 0.2s;
        }
        .dice-btn:hover { background: #2563eb; transform: translateY(-2px); }
        .dice-btn:disabled { background: #64748b; cursor: not-allowed; box-shadow: none; }
        
        .dice-display {
            width: 50px; height: 50px; background: white; color: black;
            border-radius: 8px; display: flex; justify-content: center; align-items: center;
            font-size: 28px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="info-panel">
        Navbat: <span id="current-turn">Qizil</span> o'yinchi
    </div>

    <div class="ludo-board">
        <!-- 1. Qizil Uy (Yuqori Chap) -->
        <div class="home red-home">
            <div class="home-inner">
                <div class="cell" id="red-home-0"><div class="token red-token active-turn" onclick="tokenClicked('Red', 0)"></div></div>
                <div class="cell" id="red-home-1"></div>
                <div class="cell" id="red-home-2"></div>
                <div class="cell" id="red-home-3"></div>
            </div>
        </div>

        <!-- 2. Yo'laklar (Soddalashtirilgan tartibda joylashtirish) -->
        <!-- Yuqori qism (Yashil yo'l) -->
        <div class="cell"></div><div class="cell green-path"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell green-path"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell green-path"></div><div class="cell"></div>

        <!-- 3. Yashil Uy (Yuqori O'ng) -->
        <div class="home green-home">
            <div class="home-inner">
                <div class="cell" id="green-home-0"><div class="token green-token" onclick="tokenClicked('Green', 0)"></div></div>
                <div class="cell" id="green-home-1"></div>
                <div class="cell" id="green-home-2"></div>
                <div class="cell" id="green-home-3"></div>
            </div>
        </div>

        <!-- Chap va o'ng yo'laklar o'rtasi -->
        <div class="cell"></div><div class="cell red-path"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="center-marra"><span class="marra-text">MARRA</span></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell yellow-path"></div><div class="cell"></div>

        <div class="cell red-path" id="red-start"></div><div class="cell red-path"></div><div class="cell red-path"></div><div class="cell red-path"></div><div class="cell red-path"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell yellow-path"></div><div class="cell yellow-path"></div><div class="cell yellow-path"></div><div class="cell yellow-path"></div><div class="cell yellow-path" id="yellow-start"></div>

        <!-- Pastki qism (Ko'k va Sariq uylar) -->
        <div class="home blue-home">
            <div class="home-inner">
                <div class="cell" id="blue-home-0"><div class="token blue-token" onclick="tokenClicked('Blue', 0)"></div></div>
                <div class="cell" id="blue-home-1"></div>
                <div class="cell" id="blue-home-2"></div>
                <div class="cell" id="blue-home-3"></div>
            </div>
        </div>

        <div class="cell"></div><div class="cell blue-path"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell blue-path"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell blue-path"></div><div class="cell"></div>
<div class="home yellow-home">
            <div class="home-inner">
                <div class="cell" id="yellow-home-0"><div class="token yellow-token" onclick="tokenClicked('Yellow', 0)"></div></div>
                <div class="cell" id="yellow-home-1"></div>
                <div class="cell" id="yellow-home-2"></div>
                <div class="cell" id="yellow-home-3"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="dice-display" id="dice-val">-</div>
        <button class="dice-btn" id="roll-btn" onclick="rollDice()">Zarkni tashlash 🎲</button>
    </div>

    <script>
        // O'yin mexanikasi holati
        let gameState = {
            currentPlayer: 'Red', // Kimning navbati: Red, Green, Yellow, Blue
            diceValue: 0,
            hasRolled: false,
            // Toshlarning holati: 'home' (uydaligi) yoki 'board' (yo'ldaligi)
            tokens: {
                Red: { status: 'home', cellId: 'red-start' },
                Green: { status: 'home', cellId: 'green-home-0' },
                Blue: { status: 'home', cellId: 'blue-home-0' },
                Yellow: { status: 'home', cellId: 'yellow-start' }
            }
        };

        const turnText = document.getElementById('current-turn');
        const diceDisplay = document.getElementById('dice-val');
        const rollBtn = document.getElementById('roll-btn');

        // 1. Zark tashlash funksiyasi
        function rollDice() {
            if (gameState.hasRolled) return;

            gameState.diceValue = Math.floor(Math.random() * 6) + 1;
            diceDisplay.innerText = gameState.diceValue;
            gameState.hasRolled = true;
            rollBtn.disabled = true;

            let p = gameState.currentPlayer;
